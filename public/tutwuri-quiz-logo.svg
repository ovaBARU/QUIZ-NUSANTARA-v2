<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Tut Wuri Handayani — QUIZ NUSANTARA</title>
  <desc id="desc">Logo pendidikan bergaya modern dengan api, sayap Garuda, buku dan lingkaran cahaya.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#102d6b"/><stop offset="1" stop-color="#08b9ed"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ff9f1c"/><stop offset="1" stop-color="#ffe26b"/></linearGradient>
    <linearGradient id="white" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#d7efff"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="10" flood-opacity=".3"/></filter>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#bg)"/>
  <circle cx="256" cy="220" r="164" fill="none" stroke="#ffffff" stroke-opacity=".16" stroke-width="12"/>
  <!-- stylized wings -->
  <g fill="url(#white)" filter="url(#shadow)">
    <path d="M245 267c-50-42-91-54-137-44 27 9 50 24 68 44-34-11-62-10-91 2 39 5 69 17 94 37 25 20 49 28 71 25l5-64z"/>
    <path d="M267 267c50-42 91-54 137-44-27 9-50 24-68 44 34-11 62-10 91 2-39 5-69 17-94 37-25 20-49 28-71 25l-5-64z"/>
  </g>
  <!-- flame / belencong -->
  <path d="M256 104c-37 42-48 70-36 94 9 18 25 28 36 32 11-4 27-14 36-32 12-24 1-52-36-94z" fill="url(#gold)" filter="url(#shadow)"/>
  <path d="M256 130c-17 24-20 39-13 51 4 7 9 12 13 14 4-2 9-7 13-14 7-12 4-27-13-51z" fill="#fff7b0"/>
  <!-- book -->
  <path d="M143 322c38-13 77-8 113 12v79c-36-20-75-25-113-12z" fill="#fff" opacity=".96"/>
  <path d="M369 322c-38-13-77-8-113 12v79c36-20 75-25 113-12z" fill="#dff6ff" opacity=".96"/>
  <path d="M256 334v79" stroke="#0d3b73" stroke-width="7" stroke-linecap="round"/>
  <text x="256" y="458" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="900" fill="#fff" letter-spacing="2">TUT WURI</text>
</svg>
